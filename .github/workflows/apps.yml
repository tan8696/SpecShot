# Builds the Windows installer and the Android APK from the same static export
# the website serves. Push a tag like v1.0.0 to publish both to a GitHub
# release under fixed names — the site's download popup
# (components/AppDownloadPrompt.tsx) links to releases/latest/download/<name>.
name: Apps

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/apps.yml", "desktop/**", "capacitor.config.json", "lib/download.ts", "scripts/gen-icons.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_NATIVE_APP: windows
      # The exe's file version and the installer's "Apps & features" entry come
      # from package.json. Tag builds only — Windows needs a numeric version.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version
        working-directory: desktop
      - run: npm ci && npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/SpecShot-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_NATIVE_APP: android
      - name: Generate the Android project
        run: |
          npx cap add android
          node scripts/gen-icons.mjs --android android/app/src/main/res
          # Camera for live ID-photo capture; storage so Android 9 and older can save to Documents.
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />#' android/app/src/main/AndroidManifest.xml
          # Android only installs a new APK over an old one if versionCode goes up;
          # the run number always does. versionName is the tag without its "v".
          VERSION=dev
          [[ "$GITHUB_REF" == refs/tags/v* ]] && VERSION="${GITHUB_REF_NAME#v}"
          sed -i -e "s/versionCode 1$/versionCode $GITHUB_RUN_NUMBER/" -e "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      # Signed with the release key from repo secrets, so every release installs
      # over the last one. The password reaches apksigner by env var, never argv.
      - name: Build and sign the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew && ./gradlew assembleRelease
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -c 4 "$UNSIGNED"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias specshot --out ../SpecShot.apk "$UNSIGNED"
          "$BT/apksigner" verify --print-certs ../SpecShot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SpecShot.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SpecShot-Setup.exe
            SpecShot.apk
